name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build-app.yml

  verify-artifact:
    name: Verify bundle artifact
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download app bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: app-bundle
          path: app-bundles

      - name: Inspect zip bundle
        run: |
          ZIP_FILE=$(find app-bundles -name 'bundle-v*.zip' -print -quit)
          test -n "$ZIP_FILE"
          unzip -t "$ZIP_FILE"
          unzip -l "$ZIP_FILE" | grep -q 'app/index.html'
          unzip -l "$ZIP_FILE" | grep -q 'app/forms/register/schema.json'
