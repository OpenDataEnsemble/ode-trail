name: Build App Bundle

# This is a reusable workflow for building the app bundle
# It can be called from other workflows to avoid duplication
on:
  workflow_call:
    outputs:
      zip_file:
        description: "Path to the created zip bundle"
        value: ${{ jobs.build.outputs.zip_file }}

jobs:
  build:
    name: Build App Bundle
    runs-on: ubuntu-latest
    outputs:
      zip_file: ${{ steps.verify.outputs.zip_file }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      - name: Validate form schemas
        working-directory: ./app
        run: npm run validate:forms

      - name: Build application
        working-directory: ./app
        run: npm run build

      - name: Check build output
        run: |
          if [ ! -d "app-bundles/app" ]; then
            echo "Build output directory not found!"
            exit 1
          fi
          echo "Build successful!"

      - name: Create app bundle zip
        working-directory: ./app
        run: npm run zip

      - name: Verify zip bundle
        id: verify
        run: |
          ZIP_FILE=$(ls app-bundles/bundle-v*.zip 2>/dev/null | head -1)
          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "Zip bundle not created!"
            ls -la app-bundles/ || echo "app-bundles directory contents:"
            exit 1
          fi
          echo "Zip bundle created: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> $GITHUB_OUTPUT
          unzip -l "$ZIP_FILE" | head -20
          echo "Bundle verification successful!"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-bundle
          path: app-bundles/bundle-v*.zip
          retention-days: 1

